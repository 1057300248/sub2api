name: Cline review-fix development preparation
on:
  push:
    branches: ['codex/cline-review-fixes-20261002']
    paths: ['.github/workflows/cline-review-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/cline-review-fixes-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r .github/release-tools/requirements-release.txt
      - name: Prepare explicit reviewed integration blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request,yaml
          BASE='1351636cce541b5206c2ac40b81bb7d56f8ab669'
          CANDIDATE='3e95dcfe3036ec5ceaffe64cf17d7d4ddce80327'
          REPO='1057300248/sub2api'
          assert os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_REF']=='refs/heads/codex/cline-review-fixes-20261002'
          def git(*args):return subprocess.check_output(['git',*args])
          assert git('rev-parse','HEAD').decode().strip()==os.environ['GITHUB_SHA']
          subprocess.run(['git','fetch','--no-tags','origin',CANDIDATE],check=True)
          files={}
          def read(path):
            if path not in files:files[path]=git('show',CANDIDATE+':'+path).decode()
            return files[path]
          def edit(path,old,new,count=1):
            text=read(path)
            if text.count(old)!=count:raise ValueError(f'anchor mismatch: {path} {old[:100]!r} count={text.count(old)}')
            files[path]=text.replace(old,new)
          for path in git('diff','--name-only',BASE,CANDIDATE).decode().splitlines():read(path)
          path='backend/internal/pkg/cline/json_body.go'
          edit(path,'\t"bytes"\n','')
          edit(path,'\t"encoding/json"\n','')
          start=read(path).index('\t\t} else if HasGenerationError(payload) {')
          end=read(path).index('\n\t}\n\tif len(b.pending) > 0',start)
          files[path]=read(path)[:start]+'\t\t} else {\n\t\t\tb.pending, b.terminal = b.preparePayload(payload)\n\t\t}'+read(path)[end:]
          # Generic Create must not commit the account before its durable event.
          path='backend/internal/repository/account_repo.go'
          text=read(path)
          start=text.index('func (r *accountRepository) Create(ctx context.Context, account *service.Account) error {')
          end=text.index('\nfunc createAccountRecord(',start)
          text=text[:start]+'func (r *accountRepository) Create(ctx context.Context, account *service.Account) error {\n return r.createAccountAtomic(ctx,account,nil,false)\n}\n'+text[end:]
          start=text.index('func (r *accountRepository) CreateWithAccountGroups(')
          end=text.index('\nfunc (r *accountRepository) GetByID(',start)
          text=text[:start]+'func (r *accountRepository) CreateWithAccountGroups(ctx context.Context, account *service.Account, groups []service.AccountGroup) error {\n return r.createAccountAtomic(ctx,account,groups,true)\n}\n'+text[end:]
          files[path]=text
          # Cline admin creation includes bindings in the same existing repository
          # capability. Other platform service-level creation behavior is unchanged.
          path='backend/internal/service/admin_account.go'
          old='''\tif err := s.accountRepo.Create(ctx, account); err != nil {
          \t\treturn nil, err
          \t}

          \t// 绑定分组
          \tif len(groupIDs) > 0 {
          \t\tif err := s.accountRepo.BindGroups(ctx, account.ID, groupIDs); err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t}'''
          new='''\tif account.IsCline() {
          \t\tif s.accountDuplicateRepo == nil { return nil, errors.New("atomic Cline account creation repository is unavailable") }
          \t\tbindings := make([]AccountGroup,0,len(groupIDs))
          \t\tfor i,id := range groupIDs { bindings=append(bindings,AccountGroup{GroupID:id,Priority:i+1}) }
          \t\tif err := s.accountDuplicateRepo.CreateWithAccountGroups(ctx,account,bindings); err != nil { return nil,err }
          \t} else {
          \t\tif err := s.accountRepo.Create(ctx,account); err != nil { return nil,err }
          \t\tif len(groupIDs)>0 { if err:=s.accountRepo.BindGroups(ctx,account.ID,groupIDs);err!=nil{return nil,err} }
          \t}'''
          edit(path,old,new)
          # Preserve original context values, while observing both forwarder and
          # HTTP client cancellation; a caller may already have detached ctx.
          path='backend/internal/service/cline_request_lifetime.go'
          edit(path,'stopParent func() bool','stopParents []func() bool')
          edit(path,'lifetime.stopParent=context.AfterFunc(parent,lifetime.beginDrain)','lifetime.watch(parent)')
          edit(path,'stop:=l.stopParent','stops:=l.stopParents')
          edit(path,'if stop!=nil{stop()}','for _,stop:=range stops{stop()}')
          files[path]+='''
          func(l *clineRequestLifetime)watch(parent context.Context){
           if parent==nil{return}
           stop:=context.AfterFunc(parent,l.beginDrain)
           l.mu.Lock()
           if l.closed {l.mu.Unlock();stop();return}
           l.stopParents=append(l.stopParents,stop)
           l.mu.Unlock()
           if parent.Err()!=nil{l.beginDrain()}
          }
          '''
          path='backend/internal/service/openai_gateway_cc_pipeline.go'
          edit(path,'\tupstreamCtx, releaseUpstreamCtx := detachUpstreamContext(ctx)','''\tupstreamCtx, releaseUpstreamCtx := detachUpstreamContext(ctx)
          \tvar lifetime *clineRequestLifetime
          \tif account.IsCline() {
          \t\tlifetime = newClineRequestLifetime(ctx,clineDrainGrace,clineRequestCeiling)
          \t\tif c != nil && c.Request != nil { lifetime.watch(c.Request.Context()) }
          \t\tupstreamCtx,releaseUpstreamCtx = lifetime.ctx,lifetime.close
          \t}
          \tbodyOwnsLifetime := false
          \tdefer func(){ if !bodyOwnsLifetime {releaseUpstreamCtx()} }()''')
          edit(path,'\treleaseUpstreamCtx()\n','')
          edit(path,'\tif guardResponse != nil {\n\t\tguardResponse(resp)\n\t}\n\treturn resp, nil','''\tif guardResponse != nil { guardResponse(resp) }
          \tif lifetime != nil {
          \t\tif resp == nil || resp.Body == nil { return nil, fmt.Errorf("cline upstream returned no response body") }
          \t\tresp.Body=&clineLifetimeBody{source:resp.Body,lifetime:lifetime}
          \t\tbodyOwnsLifetime=true
          \t}
          \treturn resp,nil''')
          path='backend/internal/service/openai_gateway_chat_completions_raw.go'
          text=read(path);start=text.index('func (s *OpenAIGatewayService) streamRawChatCompletions(');end=text.index('\nfunc ',start+10)
          section=text[start:end]
          section=section.replace('clientDisconnected = true','clientDisconnected = true\n beginClineBodyDrain(resp.Body)')
          old='writeLine := func(line string) {'
          assert section.count(old)==1
          section=section.replace(old,old+'\n if account.IsCline() && c.Request.Context().Err()!=nil {clientDisconnected=true;beginClineBodyDrain(resp.Body)}')
          files[path]=text[:start]+section+text[end:]
          # Tests use checked HTTP flushing; no unchecked type assertions.
          path='backend/internal/service/cline_request_lifetime_test.go'
          edit(path,'w.Header().Set("Content-Type","text/event-stream");w.WriteHeader(200);w.(http.Flusher).Flush()','defer close(stopped)\n  w.Header().Set("Content-Type","text/event-stream");w.WriteHeader(200);if err:=http.NewResponseController(w).Flush();err!=nil{return}')
          edit(path,'<-r.Context().Done();close(stopped)','<-r.Context().Done()')
          # Explicit manual-token contract: no automatic refresh or entitlement grant.
          path='frontend/src/components/account/ClineAccountModal.vue'
          edit(path,'        <p v-if="account" class="text-xs text-gray-500">','        <p v-if="draft.authType === \'account_token\'" data-testid="cline-manual-token-notice" class="text-sm text-amber-700 dark:text-amber-300">{{ t(\'clineAccount.manualTokenNotice\') }}</p>\n        <p v-if="account" class="text-xs text-gray-500">')
          for lang,value in {
            'en':'Account Token is manually maintained and may expire. Sub2API does not refresh OAuth tokens or store refresh tokens for this account type. After a 401, replace the credential and explicitly refresh saved-account metadata before retrying. This does not switch to PAYG or grant additional models.',
            'zh':'Account Token 为手工维护、可能过期的凭据。本账户类型不提供 OAuth 自动续期或 Refresh Token 管理。遇到 401 后请更换凭据，并明确刷新已保存账户的元数据后再重试；不会自动切换 PAYG 或新增模型权限。'
          }.items():
            edit(f'frontend/src/i18n/locales/{lang}/clineAccount.ts','export default {','export default {\n  manualTokenNotice: '+json.dumps(value,ensure_ascii=False)+',')
          path='frontend/src/components/account/__tests__/ClineAccountModal.spec.ts'
          files[path]=read(path)+'''
          it('explains manual account tokens without probing or changing models', async () => {
            const w=render(account)
            await w.get('[data-testid="cline-auth"]').setValue('account_token')
            expect(w.get('[data-testid="cline-manual-token-notice"]').text()).toBe('clineAccount.manualTokenNotice')
            expect(w.get<HTMLInputElement>('[data-testid="cline-upstream-model"]').element.value).toBe('cline-pass/model')
            expect(metadata.getClineMetadata).not.toHaveBeenCalled()
            expect(metadata.refreshClineMetadata).not.toHaveBeenCalled()
            expect(api.create).not.toHaveBeenCalled()
            expect(api.update).not.toHaveBeenCalled()
          })
          '''
          # Carry existing exact-SHA jobs to the new branch without weakening old
          # test names, race counts, skip rejection or read-only invariants.
          path='.github/workflows/cline-platform-development.yml';wf=yaml.safe_load(read(path))
          if True in wf:wf['on']=wf.pop(True)
          wf['on']['push']['branches'].append('codex/cline-review-fixes-20261002')
          original="github.ref == 'refs/heads/codex/cline-platform-modular-20261001'"
          for job in wf['jobs'].values():job['if']=job['if'].replace(original,"("+original+" || github.ref == 'refs/heads/codex/cline-review-fixes-20261002')")
          for step in wf['jobs']['integration']['steps']:
            name=step.get('name');run=step.get('run','')
            if name=='Check exact source and formatting without mutation':run=run.replace('gofmt -l ','gofmt -l backend/internal/repository/account_create_atomic.go ',1)
            if name=='Policy and SSE race tests':run=run.replace('required = {',"required = {'TestClineJSONEnvelopePreservesCompletionAndUsage','TestClineJSONEnvelopeRejectsInvalidAndNestedErrors',",1)
            if name=='Cline service and legacy cooldown regression tests':run=run.replace('required = {',"required = {'TestClineNonstreamEnvelopeProtocolsAndBilling','TestClineNonstreamMalformedEnvelopeNeverReturnsEmptySuccess','TestClineDrainGraceRetainsLateUsageAndStops','TestClineDrainDeadlineInterruptsBlockedHTTPRead','TestClineRequestCeilingCoversHeadersAndConcurrentCleanup','TestClineWriteDisconnectStartsDrainWithoutParentCancellation',",1)
            if run:step['run']=run
          wf['jobs']['integration']['steps'].insert(-1,{'name':'Race-check bounded Cline request ownership','working-directory':'backend','shell':'bash','run':"set -euo pipefail\ngo test -race -tags=unit -count=3 -run '^TestCline(Drain|RequestCeiling|WriteDisconnect)' ./internal/service\n"})
          for step in wf['jobs']['postgres']['steps']:
            if step.get('name')=='Actual Cline PostgreSQL CAS and migration regressions':step['run']=step['run'].replace('required = {',"required = {'TestClinePostgresCreateOutboxFailureIsAtomic','TestClinePostgresCreateReusesOuterTransaction','TestClinePostgresMaximumFreeScopeUsesUnfingerprintedColumn',",1)
          files[path]=yaml.safe_dump(wf,sort_keys=False,width=120)
          path='.wanchuan/patches/manifest.json';manifest=json.loads(read(path));module=next(x for x in manifest['modules'] if x['id']=='cline-platform')
          for glob in ['backend/internal/repository/account_create_atomic.go','backend/internal/service/admin_account.go','backend/internal/service/openai_gateway_chat_completions_raw.go']:
            if glob not in module['protected_globs']:module['protected_globs'].append(glob)
          files[path]=json.dumps(manifest,indent=2)+'\n'
          files['.wanchuan/CLINE_REVIEW_FIXES_20261002.md']='''# Cline review-fix branch

          Base: `1351636cce541b5206c2ac40b81bb7d56f8ab669`. Branch: `codex/cline-review-fixes-20261002`.

          This change normalizes standard and explicit success/data non-stream completions before any of the three protocol bridges. Malformed/unsuccessful envelopes fail rather than generating empty success. Raw usage, tool and reasoning fields are retained; streaming requests which unexpectedly return JSON still fail.

          Account creation and the scheduler outbox now share a transaction. The grouped repository capability also includes exact bindings; Cline administrator creation uses it. Existing outer transactions are reused, no uncommitted cache snapshot is published and an owned-transaction failure does not expose a generated account ID. Other platforms retain their service-level group-binding policy.

          Cline upstream requests have a 30-minute absolute lifetime ceiling. Client cancellation or raw-stream write failure starts a non-renewable 30-second drain grace. The earlier deadline wins. Context cancellation interrupts the net/http request and body reading, and response Close owns timer cleanup. These limits apply to Cline only and do not extend a downstream/NewAPI timeout, lower first-token latency or promise recovery of usage that arrives after the deadline. Existing transport limits can still expire earlier. Evaluate actual client/proxy/header/idle/total timeouts with request-level production evidence before changing those settings; no NewAPI or production settings were changed here.

          Account Token is a manually supplied, potentially expiring credential. No OAuth refresh-token protocol, automatic renewal, paid fallback or extra model entitlement is implemented. After a 401 the operator replaces the credential and explicitly refreshes metadata. Its lifetime is not hardcoded from a third-party issue report.

          The alleged 332-versus-300 Free scope overflow is not a schema defect: the 332-byte fingerprinted key lives in JSON Extra; the SQL shared scope removes the fingerprint and is at most 267 bytes. A PostgreSQL regression exercises both write paths. Free inference remains disabled and no schema limit was widened.

          New tests cover standard/wrapped non-stream forwarding for Chat/Responses/Messages with requested/upstream price selection, invalid envelopes, loopback HTTP drain cancellation, cleanup races, real PostgreSQL outbox rollback and outer transactions. The monetary test invokes actual forwarding then RecordUsage with a synthetic ledger; it is not a full HTTP-handler/production billing audit. No live key, paid inference, production migration, deployment, main/stable update or local test pass is claimed. Read exact-SHA CI results before marking this candidate accepted.
          '''
          # Print a bounded existing binding-priority implementation for review.
          original=git('show',BASE+':backend/internal/repository/account_repo.go').decode()
          marker='func (r *accountRepository) BindGroups('
          if marker in original:
            pos=original.index(marker);print('BIND GROUPS BASELINE\n'+original[pos:pos+4200])
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs):raise ValueError('redirect prohibited')
          opener=urllib.request.build_opener(NoRedirect());receipts=[]
          for path,text in sorted(files.items()):
            body=text.encode()
            if path.endswith('.go'):body=subprocess.check_output(['gofmt'],input=body)
            expected=hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()
            req=urllib.request.Request('https://api.github.com/repos/'+REPO+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(body).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with opener.open(req,timeout=30) as response:saved=json.load(response)
            assert saved['sha']==expected
            receipts.append({'path':path,'sha':expected});print(path+' '+expected,flush=True)
          subprocess.run(['git','diff','--exit-code'],check=True)
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP'])/'cline-review-blobs.json').write_text(json.dumps({'base':BASE,'candidate':CANDIDATE,'files':receipts},indent=2)+'\n')
          print('Prepared immutable blobs only. No candidate execution, commits, ref updates or validation claim.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cline-review-blobs-${{ github.sha }}
          path: ${{ runner.temp }}/cline-review-blobs.json
          retention-days: 1
          if-no-files-found: error
