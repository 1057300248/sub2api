name: Custom patch regression

on:
  push:
    branches:
      - codex/ranxi-production-cline-cas-20260925
      - codex/ranxi-v2.8.17-cline-cas-20260926
      - codex/ranxi-latest-patches-20260929
      - codex/ranxi-v2.9.3-patches-20260929
      - codex/modular-updates-20260930
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/cline-cas-validation.yml'
      - 'tools/verify_custom_patch_alignment.py'
      - 'tools/wanchuan_patchpack.py'
      - '.wanchuan/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  patch-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact upstream and complete previous customization ancestry
        env:
          PREVIOUS_CUSTOM_SHA: 95bf4b1f76dd9d4ff32b4dfca807a4ea07a97fa5
          CLINE_SHA: 94ce53353ecc501c26308ddaef36d1f8bcec78e0
          BASELINE_UPSTREAM_SHA: 412b2225a357b9bb5ee2295603253fec362dbd0f
        run: |
          set -euo pipefail
          UPSTREAM_SHA="$(jq -r '.sha' .wanchuan/upstream.lock)"
          UPSTREAM_TAG="$(jq -r '.tag' .wanchuan/upstream.lock)"
          test -n "$UPSTREAM_SHA"
          test -n "$UPSTREAM_TAG"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          git merge-base --is-ancestor "$PREVIOUS_CUSTOM_SHA" HEAD
          git merge-base --is-ancestor "$CLINE_SHA" HEAD
          python tools/wanchuan_patchpack.py verify
          git diff --check "$UPSTREAM_SHA" HEAD
          mkdir -p "$RUNNER_TEMP/patch-inventory"
          {
            git rev-parse HEAD
            printf 'upstream_tag=%s\nupstream=%s\nprevious_custom=%s\n' "$UPSTREAM_TAG" "$UPSTREAM_SHA" "$PREVIOUS_CUSTOM_SHA"
            git rev-list --count "$BASELINE_UPSTREAM_SHA..$UPSTREAM_SHA"
            git log --no-merges --format='%H %s' "$BASELINE_UPSTREAM_SHA..$UPSTREAM_SHA"
            git diff --stat "$UPSTREAM_SHA" HEAD
            git ls-files '*AGENTS.md'
          } | tee "$RUNNER_TEMP/patch-inventory/inventory.txt"
          git diff "$BASELINE_UPSTREAM_SHA" "$UPSTREAM_SHA" > "$RUNNER_TEMP/patch-inventory/upstream.patch"
          git diff "$UPSTREAM_SHA" HEAD > "$RUNNER_TEMP/patch-inventory/custom.patch"
          git archive --format=tar HEAD > "$RUNNER_TEMP/patch-inventory/source.tar"
      - uses: actions/upload-artifact@v6
        with:
          name: patch-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/patch-inventory/
          retention-days: 7
  cline-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUB2API_TEST_POSTGRES_IMAGE: postgres:18.6-alpine
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting of ported files
        run: |
          files=(internal/service/cline_ratelimit.go internal/service/cline_ratelimit_test.go internal/service/cline_ratelimit_dispatch_test.go internal/service/ratelimit_service.go)
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then printf '%s\n' "$unformatted"; exit 1; fi
      - name: Cline parsing and 429 dispatch regressions
        run: |
          set -o pipefail
          go test -tags=unit ./internal/service -run '^Test(ParseCline|SetCline|Handle429Cline)' -count=1 -json | tee "$RUNNER_TEMP/cline-unit.jsonl"
      - name: Cline race detector regressions repeated ten times
        run: go test -race -tags=unit ./internal/service -run '^Test(ParseCline|SetCline|Handle429Cline)' -count=10
      - name: PostgreSQL 18.6 monotonic CAS and scheduler regressions
        run: |
          set -o pipefail
          go test -tags=integration ./internal/repository -run '^(TestAccountRepoSuite|TestListSchedulableAccountLoadsMatchesListSchedulable)$/^TestSetRateLimitedIfLaterDoesNotShortenReset$' -count=1 -json | tee "$RUNNER_TEMP/cline-postgres.jsonl"
      - name: Verify latest upstream monitor history persistence and active-config isolation
        run: |
          set -o pipefail
          go test -tags=integration ./internal/repository -run '^TestChannelMonitorV2Candy(PersistenceAndClaims|Latest100PerActiveConfig)$' -count=1 -json | tee "$RUNNER_TEMP/monitor-postgres.jsonl"
      - name: Require selected tests to execute and pass
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = {
              'cline-unit.jsonl': {
                  'TestParseClineRateLimitResetAt',
                  'TestParseClineRateLimitResetAtRejectsOtherUpstream',
                  'TestSetClineRateLimitedPrefersAtomicExtension',
                  'TestSetClineRateLimitedDoesNotFallbackOnExtensionError',
                  'TestSetClineRateLimitedSupportsLegacyRepository',
                  'TestParseClineRateLimitResetAtScopesExactHostname',
                  'TestHandle429ClineUsesParsedCooldownBeforeProviderFallback',
                  'TestHandle429ClineCASFailureDoesNotUseRegularSetter',
                  'TestHandle429ClinePatchPreservesOtherProviderFallback',
              },
              'cline-postgres.jsonl': {
                  'TestAccountRepoSuite/TestSetRateLimitedIfLaterDoesNotShortenReset',
                  'TestListSchedulableAccountLoadsMatchesListSchedulable',
              },
              'monitor-postgres.jsonl': {
                  'TestChannelMonitorV2CandyPersistenceAndClaims',
                  'TestChannelMonitorV2CandyLatest100PerActiveConfig',
              },
          }
          for filename, expected in required.items():
              events = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / filename).read_text().splitlines() if line.strip()]
              passed = {event.get('Test') for event in events if event.get('Action') == 'pass'}
              missing = expected - passed
              failed = [event.get('Test', 'package') for event in events if event.get('Action') == 'fail']
              skipped = [event.get('Test', 'package') for event in events if event.get('Action') == 'skip']
              if missing or failed or skipped:
                  raise SystemExit(f'{filename}: missing={sorted(missing)} failed={failed} skipped={skipped}')
              print(f'{filename}: all {len(expected)} required tests passed; no skips')
          PY
      - name: Build backend
        run: go build ./cmd/server
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cline-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cline-unit.jsonl
            ${{ runner.temp }}/cline-postgres.jsonl
            ${{ runner.temp }}/monitor-postgres.jsonl
          if-no-files-found: error
          retention-days: 7
  legacy-patch-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check alignment patch formatting
        run: |
          files=(backend/internal/service/custom_patch_legacy_cookie_test.go backend/internal/handler/dto/custom_patch_legacy_cookie_test.go backend/internal/repository/custom_patch_legacy_cookie_test.go backend/internal/service/custom_patch_alignment_test.go backend/internal/config/custom_patch_defaults_test.go backend/internal/service/openai_codex_ticket.go backend/internal/service/openai_codex_ticket_feedback.go backend/internal/config/config.go)
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then printf '%s\n' "$unformatted"; exit 1; fi
      - name: Require inherited and ported legacy regressions to execute
        run: python3 tools/verify_custom_patch_alignment.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: custom-patch-regressions-${{ github.sha }}
          path: ${{ runner.temp }}/custom-patch-results/
          if-no-files-found: error
          retention-days: 7
  frontend-upgrade-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Verify newly added credential and operations UI regressions
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            src/components/account/__tests__/CredentialEncryptionSetup.spec.ts \
            src/components/account/__tests__/OpenAITwoFAImport.spec.ts \
            src/components/account/__tests__/CreateAccountModal.spec.ts \
            src/components/admin/operations/__tests__/AutoConfigHistory.spec.ts \
            src/composables/__tests__/useExcelBPSDefaults.spec.ts \
            src/views/admin/__tests__/AutoConfigView.spec.ts \
            src/views/admin/__tests__/AccountsView.lite.spec.ts \
            src/views/admin/ops/__tests__/TokenGuardView.spec.ts \
            src/views/admin/ops/__tests__/TokenGuardV2View.spec.ts \
            src/views/admin/ops/components/__tests__/OpsErrorLogTable.spec.ts \
            src/views/admin/ops/utils/__tests__/balanceError.spec.ts \
            src/features/channel-monitor-v2/__tests__/MonitorStatusCards.spec.ts \
            src/features/channel-monitor-v2/__tests__/monitorCards.spec.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/frontend-upgrade.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'frontend-upgrade.json').read_text())
          files = result.get('testResults', [])
          if len(files) != 13 or not result.get('success'):
              raise SystemExit('All 13 selected frontend test files must execute successfully')
          for suite in files:
              tests = suite.get('assertionResults', [])
              if not tests or any(test.get('status') != 'passed' for test in tests):
                  raise SystemExit(f"Missing, failed or skipped assertions in {suite.get('name')}")
          print(f"All 13 upgrade test files and {sum(len(s['assertionResults']) for s in files)} assertions passed; no skips")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-upgrade-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-upgrade.json
          if-no-files-found: error
          retention-days: 7
