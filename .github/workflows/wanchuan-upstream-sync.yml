name: Wanchuan upstream sync

on:
  push:
    branches:
      - wanchuan/stable
    paths:
      - '.wanchuan/**'
      - 'tools/wanchuan_patchpack.py'
      - 'tools/test_wanchuan_patchpack.py'
      - '.github/workflows/wanchuan-upstream-sync.yml'
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch that owns the Wanchuan custom layer
        required: false
        default: wanchuan/stable
        type: string
      publish_if_safe:
        description: Fast-forward the base branch and dispatch a release when all automatic gates pass
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: wanchuan-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

env:
  UPSTREAM_REPO: ranxi2001/sub2api
  BASE_BRANCH: ${{ inputs.base_branch || vars.WANCHUAN_BASE_BRANCH || 'wanchuan/stable' }}
  AUTO_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish_if_safe == true }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout custom base
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve latest stable upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream production --tags --force
          latest_tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name')"
          latest_sha="$(git rev-parse "${latest_tag}^{commit}")"
          old_tag="$(jq -r '.tag' .wanchuan/upstream.lock)"
          old_sha="$(jq -r '.sha' .wanchuan/upstream.lock)"
          base_start="$(git rev-parse HEAD)"
          {
            echo "tag=${latest_tag}"
            echo "sha=${latest_sha}"
            echo "old_tag=${old_tag}"
            echo "old_sha=${old_sha}"
            echo "base_start=${base_start}"
          } >> "$GITHUB_OUTPUT"
          if [[ "${latest_sha}" == "${old_sha}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already aligned to ${latest_tag} (${latest_sha})."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build compatibility plan
        id: plan
        if: ${{ steps.upstream.outputs.changed == 'true' }}
        run: |
          python3 tools/wanchuan_patchpack.py plan             --old-upstream "${{ steps.upstream.outputs.old_sha }}"             --new-upstream "${{ steps.upstream.outputs.sha }}"             --output "$RUNNER_TEMP/wanchuan-plan.json"

      - name: Merge upstream in an isolated work branch
        id: integrate
        if: ${{ steps.upstream.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.tag }}"
          sha="${{ steps.upstream.outputs.sha }}"
          work_branch="automation/upstream-${tag#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${work_branch}"

          if ! git merge --no-ff --no-edit "${sha}"; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/wanchuan-conflicts.txt" || true
            git merge --abort || true
            {
              echo "conflict=true"
              echo "work_branch=${work_branch}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          merge_commit="$(git rev-parse HEAD)"
          version="$(python3 tools/wanchuan_patchpack.py next-version --upstream-tag "${tag}" --revision 1)"
          python3 - "${tag}" "${sha}" "${merge_commit}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          tag, sha, merge_commit = sys.argv[1:4]
          path = Path(".wanchuan/upstream.lock")
          data = json.loads(path.read_text())
          data.update({
              "tag": tag,
              "sha": sha,
              "integrated_commit": merge_commit,
              "integrated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          })
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          # Keep the source VERSION identical to upstream. The Wanchuan revision
          # exists only in the release tag/build workspace, which avoids a guaranteed
          # merge conflict when upstream bumps VERSION on the next release.
          git add .wanchuan/upstream.lock
          git commit -m "chore(wanchuan): adapt ${tag}"

          {
            echo "conflict=false"
            echo "work_branch=${work_branch}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update conflict issue
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Wanchuan upstream sync blocked: ${{ steps.upstream.outputs.tag }}"
          {
            echo "Automatic three-way merge failed."
            echo
            echo "Base branch: ${BASE_BRANCH}"
            echo "Old upstream: ${{ steps.upstream.outputs.old_tag }} / ${{ steps.upstream.outputs.old_sha }}"
            echo "New upstream: ${{ steps.upstream.outputs.tag }} / ${{ steps.upstream.outputs.sha }}"
            echo
            echo "Conflicted paths:"
            sed 's/^/- /' "$RUNNER_TEMP/wanchuan-conflicts.txt"
          } > "$RUNNER_TEMP/wanchuan-conflict-body.md"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/wanchuan-conflict-body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "${title}" --body-file "$RUNNER_TEMP/wanchuan-conflict-body.md"
          fi
          exit 1

      - name: Verify patch pack binding
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        run: python3 tools/wanchuan_patchpack.py verify

      - uses: actions/setup-go@v6
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Backend unit and integration gates
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        working-directory: backend
        run: |
          make test-unit
          make test-integration
          go test -race -tags=unit ./internal/service -run '^Test(ParseCline|SetCline|Handle429Cline)' -count=10
          go build ./cmd/server

      - name: Audited custom patch regressions
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        run: python3 tools/verify_custom_patch_alignment.py

      - uses: pnpm/action-setup@v6
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        with:
          version: 9

      - uses: actions/setup-node@v6
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend gates
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        run: |
          pnpm install --frozen-lockfile --dir frontend
          make test-frontend

      - uses: actions/setup-python@v6
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        with:
          python-version: '3.12'

      - name: Release and patch-pack helper tests
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        run: |
          python -m pip install -r .github/release-tools/requirements-release.txt
          python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
          python -m unittest discover -s tools -p 'test_wanchuan_patchpack.py'

      - name: Security gates
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        run: |
          cd backend
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          cd ../frontend
          pnpm audit --prod --audit-level=high --json > audit.json || true
          cd ..
          python tools/check_pnpm_audit_exceptions.py             --audit frontend/audit.json             --exceptions .github/audit-exceptions.yml

      - name: Publish safe update or open review PR
        if: ${{ steps.upstream.outputs.changed == 'true' && steps.integrate.outputs.conflict == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work_branch="${{ steps.integrate.outputs.work_branch }}"
          version="${{ steps.integrate.outputs.version }}"
          risk="${{ steps.plan.outputs.risk }}"
          remote_base="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | awk '{print $1}')"
          can_fast_forward=false
          if [[ "${remote_base}" == "${{ steps.upstream.outputs.base_start }}" ]]; then
            can_fast_forward=true
          fi

          if [[ "${risk}" == "safe" && "${AUTO_PUBLISH}" == "true" && "${can_fast_forward}" == "true" ]]; then
            git push origin "HEAD:refs/heads/${BASE_BRANCH}"
            release_tag="v${version}"
            git tag -a "${release_tag}" -m "Wanchuan automatic adaptation of ${{ steps.upstream.outputs.tag }}"
            git push origin "refs/tags/${release_tag}"
            # release.yml is triggered by the tag push. Do not dispatch it a
            # second time or the same release can race itself.
            echo "Published safe source adaptation; tag ${release_tag} will trigger release.yml."
            exit 0
          fi

          git push --force-with-lease origin "HEAD:refs/heads/${work_branch}"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${work_branch}" --base "${BASE_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          {
            echo "Upstream: ${{ steps.upstream.outputs.tag }} (${{ steps.upstream.outputs.sha }})"
            echo
            echo "Patch-pack risk: ${risk}"
            echo
            echo "Automatic gates passed. Review is retained because protected custom paths changed, automatic publishing was not requested, or the base branch moved during validation."
            echo
            echo "Compatibility plan:"
            cat "$RUNNER_TEMP/wanchuan-plan.json"
          } > "$RUNNER_TEMP/wanchuan-pr.md"
          if [[ -z "${existing}" ]]; then
            if [[ "${risk}" == "review" ]]; then
              gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "${BASE_BRANCH}" --head "${work_branch}"                 --title "chore: adapt ${{ steps.upstream.outputs.tag }} to Wanchuan patch pack"                 --body-file "$RUNNER_TEMP/wanchuan-pr.md"
            else
              gh pr create --repo "$GITHUB_REPOSITORY" --base "${BASE_BRANCH}" --head "${work_branch}"                 --title "chore: adapt ${{ steps.upstream.outputs.tag }} to Wanchuan patch pack"                 --body-file "$RUNNER_TEMP/wanchuan-pr.md"
            fi
          else
            gh pr edit "${existing}" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/wanchuan-pr.md"
          fi
