name: Cline closeout source inspection
on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-closeout-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read bounded integration points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          ranges = {
            'backend/internal/repository/account_repo.go': [(1,60),(510,600),(985,1045),(3490,3570)],
            'backend/internal/service/channel_monitor_quota_fetcher.go': [(1,90),(185,255)],
            'backend/internal/service/channel_monitor_validate.go': [(210,260)],
            'backend/internal/handler/openai_gateway_handler.go': [(865,958),(1470,1570)],
          }
          for name, parts in ranges.items():
            p=Path(name); lines=p.read_text().splitlines()
            print('\nFILE',name,'BLOB',subprocess.check_output(['git','hash-object',name],text=True).strip())
            for start,end in parts:
              for n in range(start-1,min(end,len(lines))): print(f'{n+1}: {lines[n]}')
          patterns = [
            ('backend/internal/handler/admin/*data*.go', r'func .*validate|PlatformOpenCodeGo|PlatformDeepseek|case .*Platform|IsCNProvider'),
            ('backend/internal/service/*billing*probe*.go', r'func .*ligible|func .*upported|func .*ProbeAccount|PlatformOpenCodeGo|PlatformDeepseek'),
            ('backend/internal/service/cline*test.go', r'OpenAIGatewayService\{'),
            ('backend/internal/service/openai_gateway*.go', r'^type OpenAIGatewayService struct'),
          ]
          for glob,pattern in patterns:
            for p in sorted(Path('.').glob(glob)):
              if p.name.endswith('_test.go') and 'cline' not in p.name: continue
              lines=p.read_text().splitlines(); selected=set()
              for n,line in enumerate(lines):
                if re.search(pattern,line): selected.update(range(max(0,n-1),min(len(lines),n+18)))
              if selected:
                print('\nFILE',p,'BLOB',subprocess.check_output(['git','hash-object',str(p)],text=True).strip())
                for n in sorted(selected): print(f'{n+1}: {lines[n]}')
          print('RECENT MIGRATIONS', [p.name for p in sorted(Path('backend/migrations').glob('*.sql'))[-12:]])
          print('SCHEMA FILES', [p.name for p in Path('backend/ent/schema').glob('*group*')])
          PY
          git diff --exit-code
