name: Cline closeout source inspection
on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-closeout-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read bounded integration points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          queries = [
            ('backend/internal/service/*.go', r'^func .*doOpenAIUpstream|^type HTTPUpstream|^type AdminService interface|^func .*enqueueSchedulerOutbox|^func .*ListAccounts|^func .*GetAccount\(', 45),
            ('backend/internal/repository/*.go', r'^func .*UpdateCredentials|^func .*BulkUpdate\(|^func .*enqueueSchedulerOutbox|^func .*clientFromContext', 90),
            ('backend/internal/repository/account_repo.go', r'input.Credentials|updates.Credentials|update.Credentials|params.Credentials|Credentials != nil', 12),
            ('backend/internal/handler/openai_gateway_handler.go', r'usage.incomplete|[Ii]ncomplete|RecordUsage|recordUsage|bill', 7),
            ('backend/internal/service/*account*data*.go', r'^func |[Pp]latform', 3),
            ('backend/internal/service/*channel*monitor*.go', r'case Platform|validProviders|supportedProviders|PlatformOpenCodeGo', 3),
            ('backend/internal/server/routes/admin.go', r'^func registerAccountRoutes|/:id/usage|/:id/test', 15),
          ]
          for glob, pattern, after in queries:
            rx = re.compile(pattern)
            for p in sorted(Path('.').glob(glob)):
              if p.name.endswith('_test.go'): continue
              lines = p.read_text().splitlines()
              selected = set()
              for n, line in enumerate(lines):
                if rx.search(line): selected.update(range(max(0,n-2), min(len(lines),n+after)))
              if selected:
                print('\nFILE', p, 'BLOB', subprocess.check_output(['git','hash-object',str(p)],text=True).strip())
                for n in sorted(selected): print(f'{n+1}: {lines[n]}')
          PY
          git diff --exit-code
