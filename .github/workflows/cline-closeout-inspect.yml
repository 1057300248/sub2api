name: Cline closeout source inspection
on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-closeout-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read billing and metadata test contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          queries = [
            ('backend/internal/service/openai_gateway*go',r'^func .*forwardAsRawChat|^func .*forwardResponsesViaRawChat|^func .*forwardAnthropicViaRawChat|^func .*RecordUsage|scanner.Err\(\)|scanState.Err|streamState.Err|st.Err',20),
            ('backend/internal/service/*usage*test.go',r'^func Test.*(RecordUsage|Partial|Incomplete)|^type .*Billing.*|^type .*Usage.*Repo',4),
            ('backend/internal/service/*billing*test.go',r'^func Test.*(Dedup|Duplicate|Idempoten|RecordUsage)|^type .*Repo',4),
            ('backend/internal/handler/*test.go',r'^func Test.*(Partial|Incomplete)|^type .*Gateway.*Stub|^type .*Gateway.*Mock',4),
            ('backend/internal/handler/admin/*test.go',r'^type .*Admin.*Stub|^type .*Admin.*Mock|func .*GetAccount\(',6),
          ]
          for glob,pattern,after in queries:
            for p in sorted(Path('.').glob(glob)):
              lines=p.read_text().splitlines(); selected=set()
              for n,line in enumerate(lines):
                if re.search(pattern,line): selected.update(range(max(0,n-2),min(len(lines),n+after)))
              if selected:
                print('\nFILE',p,'BLOB',subprocess.check_output(['git','hash-object',str(p)],text=True).strip())
                for n in sorted(selected):print(f'{n+1}: {lines[n]}')
          for name,lo,hi in [('backend/internal/handler/openai_gateway_handler.go',958,995),('backend/internal/handler/openai_gateway_handler.go',1570,1610)]:
            lines=Path(name).read_text().splitlines();print('\nFILE',name)
            for n in range(lo-1,min(hi,len(lines))):print(f'{n+1}: {lines[n]}')
          PY
          git diff --exit-code
