name: Cline CI repair preparation

on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-ci-repair-prep.yml']

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Prepare reviewed repairs as unreferenced blobs only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path('.')
          expected = {
              'backend/internal/server/api_contract_test.go': '3f39226246d1f777ad6ec3738b496a67f2e92585',
              'backend/internal/pkg/cline/body.go': '2ba8f396e51b4a4dc97424144fd1adce638db5db',
              'backend/internal/pkg/cline/body_test.go': 'cdb7240e7b271c524dc16279e66d9b772a36e8c6',
              'backend/internal/pkg/cline/contract.go': '0b3f332b12efdf041e7469da3bc2d5578327b22a',
              'backend/internal/pkg/cline/stream.go': 'de0750a9d8127d389858984d4157b685f6b121d8',
          }
          texts = {}
          for name, sha in expected.items():
              raw = (root/name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if actual != sha:
                  raise SystemExit(f'refusing unexpected blob: {name}: {actual} != {sha}')
              texts[name] = raw.decode('utf-8')
          name = 'backend/internal/server/api_contract_test.go'
          pattern = r'("default_platform_quotas"\s*:\s*\{)'
          if len(re.findall(pattern, texts[name])) != 2:
              raise SystemExit('expected exactly two static settings quota fixtures')
          texts[name] = re.sub(pattern, lambda m: m[1] + '"cline":{"daily":null,"weekly":null,"monthly":null},', texts[name])
          replacements = {
              'backend/internal/pkg/cline/body.go': ('fmt.Errorf("Cline SSE line exceeds configured limit")', 'fmt.Errorf("cline SSE line exceeds configured limit")'),
              'backend/internal/pkg/cline/contract.go': ('errors.New("Cline Free is IDE/CLI-only; unverified public API forwarding is disabled")', 'errors.New("cline Free is IDE/CLI-only; unverified public API forwarding is disabled")'),
              'backend/internal/pkg/cline/stream.go': ('errors.New("Cline upstream reported an explicit generation failure")', 'errors.New("cline upstream reported an explicit generation failure")'),
          }
          for name, (before, after) in replacements.items():
              if texts[name].count(before) != 1:
                  raise SystemExit(f'non-unique repair target: {name}')
              texts[name] = texts[name].replace(before, after, 1)
          name = 'backend/internal/pkg/cline/body_test.go'
          changes = [
              ('\tdefer r.Close()', '\tcloseClineTestBody(t, r)'),
              ('\tr := GuardSSEBody(io.NopCloser(strings.NewReader(input)), 1024, nil)', '\tr := GuardSSEBody(io.NopCloser(strings.NewReader(input)), 1024, nil)\n\tcloseClineTestBody(t, r)'),
              ('\tr = GuardSSEBody(io.NopCloser(strings.NewReader(strings.Repeat("x", 100))), 32, nil)', '\tr = GuardSSEBody(io.NopCloser(strings.NewReader(strings.Repeat("x", 100))), 32, nil)\n\tcloseClineTestBody(t, r)'),
          ]
          for before, after in changes:
              if texts[name].count(before) != 1:
                  raise SystemExit(f'non-unique cleanup target: {before}')
              texts[name] = texts[name].replace(before, after, 1)
          texts[name] += '''
          // Capture each body by value so reassigning the reader does not leak it.
          func closeClineTestBody(t *testing.T, body io.Closer) {
              t.Helper()
              t.Cleanup(func() {
                  if err := body.Close(); err != nil {
                      t.Errorf("close SSE body: %v", err)
                  }
              })
          }

          type clineCloseTestBody struct {
              io.Reader
              closeErr error
              closeCalls int
          }

          func (b *clineCloseTestBody) Close() error {
              b.closeCalls++
              return b.closeErr
          }

          func TestClineSSEClosePropagatesSourceError(t *testing.T) {
              want := errors.New("source close failed")
              source := &clineCloseTestBody{Reader: strings.NewReader(""), closeErr: want}
              reader := GuardSSEBody(source, 0, nil)
              if err := reader.Close(); !errors.Is(err, want) {
                  t.Fatalf("close error = %v, want %v", err, want)
              }
              if source.closeCalls != 1 {
                  t.Fatalf("close calls = %d, want 1", source.closeCalls)
              }
          }

          func TestClineSSEFailureIsStickyAcrossSmallReads(t *testing.T) {
              input := "data: {\\\"choices\\\":[{\\\"finish_reason\\\":\\\"error\\\"}]}\\n\\ndata: [DONE]\\n\\n"
              calls := 0
              reader := GuardSSEBody(io.NopCloser(strings.NewReader(input)), 1024, func([]byte) { calls++ })
              closeClineTestBody(t, reader)
              buf := make([]byte, 1)
              for attempt := 0; attempt < 3; attempt++ {
                  if n, err := reader.Read(buf); n != 0 || !errors.Is(err, ErrStreamFailure) {
                      t.Fatalf("read %d: n=%d err=%v", attempt, n, err)
                  }
              }
              if calls != 1 {
                  t.Fatalf("error callbacks = %d, want 1", calls)
              }
          }
          '''
          for name, text in texts.items():
              (root/name).write_text(text, encoding='utf-8')
          subprocess.run(['gofmt', '-w', *texts], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--stat'], check=True)
          subprocess.run(['git', 'diff', '--', *texts], check=True)
          results = []
          for name in texts:
              payload = json.dumps({'encoding': 'utf-8', 'content': (root/name).read_text()})
              response = subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs', '--input', '-'], input=payload, text=True, capture_output=True, timeout=30, check=True)
              data = json.loads(response.stdout)
              expected_sha = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              if data.get('sha') != expected_sha:
                  raise SystemExit(f'blob upload mismatch: {name}')
              results.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected_sha})
          print('REPAIR_BLOBS=' + json.dumps(results))
          print('No branch, tag, release, database or production service was modified by this job.')
          PY
