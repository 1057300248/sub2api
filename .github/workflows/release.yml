name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag/ref to execute'
        required: true
        type: string
      simple_release:
        description: 'Simple release mode'
        required: false
        type: boolean
        default: false
      notify_release:
        description: 'Send release notification'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build and verify without publishing'
        required: false
        type: boolean
        default: false

# The default branch is a control plane only. Wanchuan releases are dispatched
# with --ref pointing at an immutable Wanchuan tag; GitHub then executes the
# complete release workflow stored at that tag. If this default-branch shim is
# ever executed directly, fail closed instead of publishing stale main code.
permissions:
  contents: read

jobs:
  control-plane-only:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse default-branch publication
        run: |
          echo "::error::main is the Wanchuan control plane; dispatch an immutable Wanchuan tag instead."
          exit 1
