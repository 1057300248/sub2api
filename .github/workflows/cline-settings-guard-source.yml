name: Prepare Cline settings guard sources
on:
  push:
    branches: [codex/sub2-v2910-cline-only-20261006]
permissions:
  contents: read
jobs:
  prepare-settings-guard:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/sub2-v2910-cline-only-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact patch, verify source tree and store blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'b32ecd04bec697f5cf26448ee40809926615a148'
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request,zlib
          from pathlib import Path
          encoded = ''
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==24050 and hashlib.sha256(patch).hexdigest()=='36e685e5e422b6dc6f56cca57b6d1531f847c9a803022ec429de55045acd0357'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','.github/workflows/cline-dom-source.yml','.github/workflows/cline-settings-guard-source.yml'],check=True)
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='f92fe9b09ec2cb25876733c3b4ac1e63fad07883'
          subprocess.run(['python3','tools/verify_cline_only.py'],check=True)
          subprocess.run(['python3','tools/verify_cline_platform.py'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','f25d03718b59d9aadc0a40a6ae78fb12894d695a']).decode().splitlines()
          assert len(paths)==12
          entries=[]
          for name in paths:
              data=Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/1057300248/sub2api/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as response: result=json.load(response)
              assert result['sha']==expected
              entries.append({'path':name,'mode':'100644','type':'blob','sha':expected})
          report={'parent':os.environ['GITHUB_SHA'],'tree':'f92fe9b09ec2cb25876733c3b4ac1e63fad07883','entries':entries}
          Path(os.environ['RUNNER_TEMP'],'cline-settings-guard-sources.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cline-settings-guard-sources-${{ github.sha }}
          path: ${{ runner.temp }}/cline-settings-guard-sources.json
          retention-days: 1
