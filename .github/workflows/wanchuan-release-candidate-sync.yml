name: Wanchuan candidate sync

on:
  push:
    branches:
      - wanchuan/stable
  workflow_dispatch:

concurrency:
  group: wanchuan-candidate-sync
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact stable head
        uses: actions/checkout@v6
        with:
          ref: wanchuan/stable
          fetch-depth: 0
          persist-credentials: true

      - name: Mirror stable head to release-candidate
        run: |
          set -euo pipefail
          stable_sha="$(git rev-parse HEAD)"
          git fetch origin wanchuan/release-candidate || true

          if git rev-parse --verify origin/wanchuan/release-candidate >/dev/null 2>&1; then
            candidate_sha="$(git rev-parse origin/wanchuan/release-candidate)"
            if [[ "${candidate_sha}" != "${stable_sha}" ]]; then
              git push                 --force-with-lease="refs/heads/wanchuan/release-candidate:${candidate_sha}"                 origin "${stable_sha}:refs/heads/wanchuan/release-candidate"
            else
              echo "Candidate already matches stable: ${stable_sha}"
            fi
          else
            git push origin "${stable_sha}:refs/heads/wanchuan/release-candidate"
          fi

          echo "Release candidate now points to ${stable_sha}."
          gh workflow run wanchuan-release-candidate.yml             --repo "$GITHUB_REPOSITORY"             --ref wanchuan/release-candidate             -f revision=1
          echo "Dispatched non-publishing release candidate validation."
