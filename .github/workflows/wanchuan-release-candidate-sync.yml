name: Wanchuan candidate sync

on:
  push:
    branches: [wanchuan/stable]
  workflow_dispatch:

concurrency:
  group: wanchuan-candidate-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.ref == 'refs/heads/wanchuan/stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Mirror exact source and ensure every validation workflow
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote --exit-code origin refs/heads/wanchuan/stable | cut -f1)"
          if [[ "$remote_sha" != "$sha" ]]; then
            echo 'Stable advanced; this stale invocation cannot move the candidate.'
            exit 1
          fi
          # Candidate history is now aligned; never discard another writer's work.
          git push origin "$sha:refs/heads/wanchuan/release-candidate"
          python3 tools/wanchuan_ci_gate.py ensure --sha "$sha" --output "$RUNNER_TEMP/wanchuan-gates.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wanchuan-gate-dispatch-${{ github.sha }}
          path: ${{ runner.temp }}/wanchuan-gates.json
          if-no-files-found: warn
