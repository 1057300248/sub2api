name: Wanchuan upstream scheduler

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: wanchuan-upstream-scheduler
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    if: github.repository == '1057300248/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: wanchuan/stable
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve upstream without writing synthetic stable commits
        id: upstream
        run: |
          set -euo pipefail
          python3 tools/wanchuan_patchpack.py verify
          gh api repos/ranxi2001/sub2api/releases/latest > "$RUNNER_TEMP/upstream.json"
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'upstream.json').read_text())
          tag = release['tag_name']
          if release.get('draft') or release.get('prerelease') or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Not a stable upstream release')
          subprocess.run(['git', 'fetch', '--no-tags', 'https://github.com/ranxi2001/sub2api.git', f'refs/tags/{tag}:refs/wanchuan/upstream-candidate'], check=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'refs/wanchuan/upstream-candidate^{commit}'], text=True).strip()
          lock = json.loads(Path('.wanchuan/upstream.lock').read_text())
          if tag == lock['tag'] and sha != lock['sha']:
              raise SystemExit('Upstream retag detected; automatic adaptation blocked')
          changed = tag != lock['tag'] or sha != lock['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'changed={str(changed).lower()}\ntag={tag}\n')
          PY
      - name: Dispatch adaptation explicitly
        if: steps.upstream.outputs.changed == 'true'
        run: gh workflow run wanchuan-upstream-sync.yml --repo "$GITHUB_REPOSITORY" --ref wanchuan/stable -f base_branch=wanchuan/stable -f publish_if_safe=true
      - name: Recover missing validation and bootstrap release
        if: steps.upstream.outputs.changed == 'false'
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          candidate="$(git ls-remote --exit-code origin refs/heads/wanchuan/release-candidate | cut -f1)"
          if [[ "$candidate" != "$sha" ]]; then
            gh workflow run wanchuan-release-candidate-sync.yml --repo "$GITHUB_REPOSITORY" --ref wanchuan/stable
            exit 0
          fi
          python3 tools/wanchuan_ci_gate.py ensure --sha "$sha"
          if ! python3 tools/wanchuan_ci_gate.py verify --sha "$sha" --output "$RUNNER_TEMP/wanchuan-gates.json"; then
            echo 'Not ready for promotion; no release or tag was created.'
            exit 0
          fi
          python3 - <<'PYCODE'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          base_tag = json.loads(Path('.wanchuan/upstream.lock').read_text())['tag']
          pattern = re.compile(re.escape(base_tag) + r'-wanchuan\.[1-9][0-9]*')
          payload = subprocess.check_output(['gh', 'api', '--paginate', '--slurp', f'repos/{repo}/releases?per_page=100'], text=True)
          pages = json.loads(payload)
          if not isinstance(pages, list) or not pages or any(not isinstance(page, list) for page in pages):
              raise SystemExit('Invalid release-list response')
          for page in pages:
              for release in page:
                  if not isinstance(release, dict):
                      raise SystemExit('Invalid release entry')
                  if pattern.fullmatch(release.get('tag_name', '')):
                      if release.get('draft') or release.get('prerelease'):
                          raise SystemExit('An incomplete candidate release exists; inspect it before recovery')
                      names = {asset.get('name') for asset in release.get('assets', [])}
                      if not {'checksums.txt', 'wanchuan-release.json'}.issubset(names):
                          raise SystemExit('An incomplete published release exists; inspect it before recovery')
                      print('This upstream base already has a published owner revision; later local revisions require explicit promotion.')
                      raise SystemExit(0)
          # Failed, immutable tags may consume a revision without publishing it.
          # Let the promoter choose the next safe revision; never overwrite tag 1.
          subprocess.run(['gh', 'workflow', 'run', 'wanchuan-promote.yml', '--repo', repo, '--ref', 'main', '-f', 'revision=auto'], check=True)
          PYCODE
