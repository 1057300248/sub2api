name: Cline closeout development blob preparation
on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-closeout-prepare.yml', '.wanchuan/cline-closeout-prepare.py']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r .github/release-tools/requirements-release.txt
      - name: Prepare immutable reviewed source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .wanchuan/cline-closeout-prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: cline-closeout-blobs-${{ github.sha }}
          path: ${{ runner.temp }}/cline-closeout-blobs.json
          retention-days: 1
          if-no-files-found: error
