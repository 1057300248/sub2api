name: Cline bounded failure diagnostics
on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-failure-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read bounded existing failure evidence and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error, urllib.parse
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, *args, **kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          root='https://api.github.com/repos/1057300248/sub2api'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def api(path):
            with opener.open(urllib.request.Request(root+path,headers=headers),timeout=30) as response:
              return json.load(response)
          job=api('/actions/jobs/110441195068')
          assert job['head_sha']=='3e484461f81cf82dd00851e06b28fa94dff9bfca' and job['conclusion']=='failure'
          request=urllib.request.Request(root+'/actions/jobs/110441195068/logs',headers=headers)
          try:
            response=opener.open(request,timeout=30)
          except urllib.error.HTTPError as error:
            if error.code!=302: raise SystemExit('log read failed: '+str(error.code))
            location=error.headers['Location']; parsed=urllib.parse.urlsplit(location)
            assert parsed.scheme=='https' and parsed.hostname and not parsed.username
            # Never forward repository authorization to the signed log host.
            response=urllib.request.urlopen(urllib.request.Request(location),timeout=30)
          with response:
            body=response.read(32*1024*1024+1)
          assert len(body)<=32*1024*1024
          lines=[]
          for raw in body.decode('utf-8-sig').splitlines():
            index=raw.find('{"Time"')
            if index>=0:
              try:
                event=json.loads(raw[index:]); output=event.get('Output','')
                if output: lines.extend(output.splitlines())
                continue
              except ValueError: pass
            lines.append(raw)
          selected=set()
          for n,line in enumerate(lines):
            if re.search(r'Error Trace:|Error:|panic:|--- FAIL:|expected:|actual\s*:',line):
              selected.update(range(max(0,n-2),min(len(lines),n+7)))
          print('EXISTING FAILED JOB',job['id'],'SOURCE',job['head_sha'])
          for n in sorted(selected)[:140]:print(lines[n][:1400])
          print('SOURCE BOUNDARIES')
          for path in sorted(Path('backend/internal/service').glob('*.go')):
            if path.name.endswith('_test.go'):continue
            text=path.read_text().splitlines()
            for n,line in enumerate(text):
              if re.match(r'^func .*computePeakAwareMultipliers|^func .*UserGroupRateMultiplier\(|^func .*UsageBillingCommand\) Normalize\(',line):
                print('FILE',path)
                for i in range(n,min(n+65,len(text))):print(f'{i+1}: {text[i]}')
          PY
          git diff --exit-code
