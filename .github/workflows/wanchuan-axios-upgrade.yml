name: Wanchuan Axios security upgrade

on:
  push:
    branches: [codex/wanchuan-axios-1-20-0-20261001]
  workflow_dispatch:

concurrency:
  group: wanchuan-axios-security-upgrade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upgrade:
    if: github.ref == 'refs/heads/codex/wanchuan-axios-1-20-0-20261001' && github.repository == '1057300248/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Resolve an exact official release using the package manager
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          path = Path('frontend/package.json')
          data = json.loads(path.read_text())
          data['dependencies']['axios'] = '1.20.0'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PYCODE
          pnpm --dir frontend install --lockfile-only --ignore-scripts
      - name: Install and verify frozen lockfile
        run: |
          set -euo pipefail
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec node --input-type=module -e 'import axios from "axios"; if (axios.VERSION !== "1.20.0") process.exit(1); console.log("axios", axios.VERSION)'
      - name: Require audit policy without new exceptions
        run: |
          set -euo pipefail
          pnpm --dir frontend audit --prod --audit-level=high --json > "$RUNNER_TEMP/axios-audit.json" || true
          python3 tools/check_pnpm_audit_exceptions.py --audit "$RUNNER_TEMP/axios-audit.json" --exceptions .github/audit-exceptions.yml
      - name: Frontend lint typechecks and regression suites
        run: make test-frontend
      - name: Build production frontend
        run: pnpm --dir frontend run build
      - name: Commit only verified dependency files to the maintenance branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z'], text=True).split('\0')
          if set(filter(None, changed)) - {'frontend/package.json', 'frontend/pnpm-lock.yaml'}:
              raise SystemExit('Unexpected source or policy changes; refusing to commit')
          if json.loads(Path('frontend/package.json').read_text())['dependencies']['axios'] != '1.20.0':
              raise SystemExit('Axios is not pinned to the audited version')
          PY
          git diff --check
          if git diff --quiet; then
            echo 'Dependency files already aligned; no commit required.'
            exit 0
          fi
          branch='codex/wanchuan-axios-1-20-0-20261001'
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/pnpm-lock.yaml
          git commit -m 'fix(deps): pin Axios 1.20.0 after audit and frontend regressions'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > "$RUNNER_TEMP/axios-source-sha.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wanchuan-axios-upgrade-evidence-${{ github.run_id }}
          path: |
            frontend/package.json
            frontend/pnpm-lock.yaml
            ${{ runner.temp }}/axios-audit.json
            ${{ runner.temp }}/axios-source-sha.txt
          if-no-files-found: warn
          retention-days: 7
