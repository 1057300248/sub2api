name: Prepare legacy cookie privacy blob

on:
  push:
    branches: [codex/ranxi-latest-patches-20260929]
    paths: [.github/workflows/prepare-ticket-alignment.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/ranxi-latest-patches-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cf463489c69e9a702426a17ec8c7909eff9b87dc
          persist-credentials: false
      - name: Prepare reviewed privacy blob without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          path = 'backend/internal/service/openai_codex_ticket.go'
          before = '1b93283f0f8b756c22e14e7d664aff76cb36dce3'
          after = '13360c65ba9763b1a244b4106e18f77cb26c8978'
          old = '// IsOpenAICodexTicketExtraKey identifies server-managed ticket material.\nfunc IsOpenAICodexTicketExtraKey(key string) bool {\n\treturn strings.HasPrefix(key, openAICodexTicketExtraKeyPrefix)\n}'
          new = '// IsOpenAICodexTicketExtraKey identifies server-managed credential material.\n// The retired cookie jar stays private and write-protected during upgrades,\n// even though the new ticket-bound egress no longer reads or replays it.\nfunc IsOpenAICodexTicketExtraKey(key string) bool {\n\treturn strings.TrimSpace(key) == "codex_cookie_jar" || strings.HasPrefix(key, openAICodexTicketExtraKeyPrefix)\n}'
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          data = Path(path).read_bytes()
          if blob_sha(data) != before:
              raise SystemExit('source differs from reviewed baseline')
          text = data.decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit('replacement is not unique')
          text = text.replace(old, new, 1)
          if blob_sha(text.encode('utf-8')) != after:
              raise SystemExit('output differs from reviewed patch')
          result = subprocess.run(
              ['gh', 'api', '--method', 'POST', 'repos/1057300248/sub2api/git/blobs', '--input', '-'],
              input=json.dumps({'content': text, 'encoding': 'utf-8'}),
              text=True, capture_output=True, check=True)
          if json.loads(result.stdout)['sha'] != after:
              raise SystemExit('uploaded blob mismatch')
          print(f'prepared {path} {after}; no ref, tag, release, database or deployment changed')
          PY
