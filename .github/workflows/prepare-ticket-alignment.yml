name: Prepare ticket alignment blobs

on:
  push:
    branches: [codex/ranxi-latest-patches-20260929]
    paths: [.github/workflows/prepare-ticket-alignment.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/ranxi-latest-patches-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8e53578ca54c2dd35d1f1d079253184b7a7d9e2f
          persist-credentials: false
      - name: Prepare three reviewed Git blobs without updating any refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          changes = {
              'backend/internal/service/openai_codex_ticket.go': (
                  'eac32ab63e0fea63ca45a672d26885c04342873f',
                  '1b93283f0f8b756c22e14e7d664aff76cb36dce3',
                  [('\t\tcfg.TTLSeconds = 3600\n', '\t\tcfg.TTLSeconds = int(openAICodexCredentialTTL / time.Second)\n'),
                   ('\t\tcfg.RefreshBeforeSeconds = 600\n', '\t\tcfg.RefreshBeforeSeconds = 60\n')]),
              'backend/internal/service/openai_codex_ticket_feedback.go': (
                  'b028dae7ef9dd1017506e21a15c75a340d01f1b0',
                  '24a4f31a7bb8f2c67e1af365c164dd78a7d84254',
                  [('\t\tttlSeconds = 3600\n', '\t\tttlSeconds = int(openAICodexCredentialTTL / time.Second)\n')]),
              'backend/internal/config/config.go': (
                  'fcf31d60a8d7f577713b0111e95aa30baa56ccae',
                  'e3bf045341eb5819f4fcf49e0089b2a6de4e1dcd',
                  [('// 门票默认有效 3600 秒，临近过期前 refresh_before_seconds 重新打票。',
                    '// 门票默认名义有效期为 240 秒，提前 60 秒刷新；实际有效期仍受签发时间及路由凭证约束。')]),
          }
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for filename, (before, after, edits) in changes.items():
              raw = Path(filename).read_bytes()
              if blob_sha(raw) != before:
                  raise SystemExit(f'{filename}: original blob changed')
              text = raw.decode('utf-8')
              for old, new in edits:
                  if text.count(old) != 1:
                      raise SystemExit(f'{filename}: replacement is not unique')
                  text = text.replace(old, new, 1)
              if blob_sha(text.encode('utf-8')) != after:
                  raise SystemExit(f'{filename}: output differs from reviewed patch')
              result = subprocess.run(
                  ['gh', 'api', '--method', 'POST', 'repos/1057300248/sub2api/git/blobs', '--input', '-'],
                  input=json.dumps({'content': text, 'encoding': 'utf-8'}),
                  text=True, capture_output=True, check=True)
              uploaded = json.loads(result.stdout)
              if uploaded['sha'] != after:
                  raise SystemExit(f'{filename}: uploaded blob mismatch')
              print(f'prepared {filename} {after}')
          print('All reviewed blobs prepared; no branch, main, tag, release or deployment changed.')
          PY
