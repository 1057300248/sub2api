name: Cline platform development
on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-platform-development.yml', 'backend/internal/pkg/cline/**', 'tools/cline_platform_apply.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    if: github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Cline policy race tests
        working-directory: backend
        run: go test -race -count=3 -v ./internal/pkg/cline
      - name: Inspect exact source contracts
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,re
          specs={
           'backend/internal/service/cn_provider_quota_service.go': r'type CNProvider|func NewCN|func cnValidateProbeURL|httpUpstream.Do',
           'backend/internal/service/account_test_service.go': r'type AccountTestService|func NewAccountTest|testCNProviderChat',
           'backend/internal/service/upstream_models.go': r'type UpstreamModel|func .*SyncUpstreamModels|func newUpstreamModel',
           'backend/internal/service/admin_account.go': r'func .*buildAccountForCreate|func .*UpdateAccount\(|func .*BulkUpdateAccounts\(|Prepare bulk updates|MergePreservingSensitive',
           'backend/internal/service/account_service.go': r'func .*Create\(|func .*Update\(',
           'backend/internal/service/model_rate_limit.go': r'^func ',
           'backend/internal/service/ratelimit_service.go': r'func .*handleUpstreamErrorAfterStreakReset|func .*CheckErrorPolicy',
           'backend/internal/repository/account_repo.go': r'func .*SetModelRateLimit|type accountRepository|func .*syncSchedulerAccountSnapshot',
           'backend/internal/handler/admin/account_handler.go': r'type AccountHandler',
           'backend/internal/server/routes/admin.go': r'accounts :=|accounts.GET|accounts.POST',
           'backend/internal/service/openai_gateway_scheduling.go': r'func .*normalizePlatform|func .*NormalizePlatform',
           'backend/internal/service/openai_gateway_forward.go': r'func .*shouldForwardOpenAIAPIKeyAsRawChatCompletions|func .*buildUpstreamRequest',
           'backend/internal/service/openai_messages_dispatch.go': r'PlatformOpenCodeGo|IsCNProvider',
           'backend/internal/service/responses_chat_fallback.go': r'func requiresDeepSeekChatReasoning',
           'backend/internal/service/openai_gateway_chat_completions_raw.go': r'func .*streamRawChatCompletions|func .*bufferRawChatCompletions|resultWithUsage :=|scanErr :=|scanner.Scan',
           'frontend/src/components/account/CreateAccountModal.vue': r'selectOpenCodeGoPlatform|const openCodeAccountMode|Account Type Selection \(Anthropic\)|doCreateAccount\(|defaultBaseUrl|credentials.account_mode',
           'frontend/src/components/account/EditAccountModal.vue': r'const openCodeAccountMode|syncFormFromAccount|updatePayload.credentials = newCredentials|const defaultBaseUrl|API Key Fields|API Key.*字段',
           'frontend/src/components/account/AccountUsageCell.vue': r"isCNProvider|cnProvider|PlatformOpenCodeGo|account.platform === 'opencode_go'",
          }
          for name,pattern in specs.items():
           p=pathlib.Path(name)
           if not p.exists(): print('MISSING',name);continue
           lines=p.read_text().splitlines(); hits=[i for i,x in enumerate(lines) if re.search(pattern,x)]
           print('\nFILE',name)
           span=35 if name.endswith('.go') else 12
           for i in sorted({j for i in hits for j in range(max(0,i-3),min(len(lines),i+span))}):print(f'{i+1}: {lines[i]}')
          for name in ['backend/internal/service/domain_constants.go','frontend/src/constants/platforms.ts','backend/migrations/238_opencode_go_platform.sql']:
           p=pathlib.Path(name)
           if p.exists():print('\nFULL FILE',name,'\n',p.read_text())
          PY
