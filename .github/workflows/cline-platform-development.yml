name: Cline platform development
on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-platform-development.yml', 'backend/**/cline*', 'backend/internal/pkg/cline/**', 'tools/cline_platform_apply.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cline-platform-development
  cancel-in-progress: false
jobs:
  integration:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply baseline-guarded source integration
        run: python3 tools/cline_platform_apply.py
      - name: Format Cline additions
        run: |
          gofmt -w backend/internal/domain/cline.go backend/internal/pkg/cline/*.go backend/internal/service/cline*.go backend/internal/repository/cline*.go
          git diff --check
      - name: Policy and SSE race tests
        working-directory: backend
        run: go test -race -count=3 ./internal/pkg/cline
      - name: Compile host and exercise Cline service tests
        working-directory: backend
        run: go test -count=1 -run '^TestCline' ./internal/service ./internal/repository ./internal/handler/admin
      - name: Commit verified generated integration to this development branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          target='refs/heads/codex/cline-platform-modular-20261001'
          test "$GITHUB_REF" = "$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain backend/go.mod backend/go.sum)"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add backend/internal tools/cline_platform_apply.py
            git commit -m 'feat(cline): wire validated account and scoped limit boundaries'
            git push origin "HEAD:$target"
          fi
          git rev-parse HEAD
      - name: Inspect remaining registration boundaries
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          pattern=re.compile(r'PlatformOpenCodeGo|opencode_go|func requiresDeepSeekChatReasoning|func .*ObserverCanManage|func .*GetAccount\(')
          for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
            p=pathlib.Path(name)
            if not name.startswith(('backend/internal/','backend/ent/schema/','frontend/src/')) or p.suffix not in ('.go','.ts','.vue'):continue
            if '_test.go' in name or '.test.' in name or '/i18n/' in name or '/locales/' in name:continue
            lines=p.read_text().splitlines();hits=[i for i,line in enumerate(lines) if pattern.search(line)]
            if not hits:continue
            print('\nSITE',name)
            for i in sorted({j for i in hits for j in range(max(0,i-2),min(len(lines),i+4))}):print(f'{i+1}: {lines[i]}')
          PY
