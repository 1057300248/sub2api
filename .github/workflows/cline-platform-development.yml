name: Cline platform development
on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-platform-development.yml', 'tools/cline_platform_apply.py', 'tools/cline_platform_edits.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: |
          git rev-parse HEAD
          mkdir -p /tmp/cline-source
          git archive --format=tar HEAD -o /tmp/cline-source/source.tar
          git rev-parse HEAD > /tmp/cline-source/commit.txt
          sha256sum /tmp/cline-source/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: cline-source-snapshot
          path: /tmp/cline-source/
          retention-days: 1
          if-no-files-found: error
