name: Cline v2.10 rebuild evidence
on:
  push:
    branches: [codex/sub2-v2100-cline-rebuild-20261007]
    paths: [.github/workflows/cline-v210-rebuild.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Collect exact source trees and deltas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git fetch --no-tags https://github.com/1057300248/sub2api.git c0fd7815108a5dd59b171a3e89b4cbbf61781a7f e6addfe4aff745c859f9bb50817bc468e0e1f4f7
          git fetch --no-tags https://github.com/ranxi2001/sub2api.git 5ca3cca21eeaf4ca8a694a7f2f8f0ecd9575c549
          python3 - <<'PY'
          import json, pathlib, subprocess
          pins = {'upstream': '5ca3cca21eeaf4ca8a694a7f2f8f0ecd9575c549', 'previous_base': 'e6addfe4aff745c859f9bb50817bc468e0e1f4f7', 'previous_candidate': 'c0fd7815108a5dd59b171a3e89b4cbbf61781a7f'}
          p=pathlib.Path('evidence')
          for name, sha in pins.items():
              subprocess.run(['git','archive','--format=tar.gz','--output='+str(p/(name+'.tar.gz')),sha], check=True)
              data=subprocess.check_output(['git','ls-tree','-r','-z',sha]).decode()
              entries=[]
              for item in data.split('\0'):
                  if not item: continue
                  meta,path=item.split('\t',1)
                  mode,kind,oid=meta.split()
                  entries.append({'path':path,'mode':mode,'type':kind,'sha':oid})
              (p/(name+'-tree.json')).write_text(json.dumps(entries,ensure_ascii=False,indent=2))
          (p/'pins.json').write_text(json.dumps(pins,indent=2))
          for name,base,head in [('cline-overlay',pins['previous_base'],pins['previous_candidate']),('upstream-upgrade',pins['previous_base'],pins['upstream'])]:
              for suffix,args in [('diff',['--binary']),('names.txt',['--name-status']),('stats.txt',['--stat'])]:
                  (p/(name+'.'+suffix)).write_bytes(subprocess.check_output(['git','diff',*args,base,head]))
          print((p/'cline-overlay.stats.txt').read_text())
          print((p/'upstream-upgrade.stats.txt').read_text())
          PY
      - name: Inspect named Cline fork without executing its code
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/giscatgis-lang/sub2api-cline.git /tmp/sub2api-cline-research
          git -C /tmp/sub2api-cline-research rev-parse HEAD > evidence/named-fork-head.txt
          git -C /tmp/sub2api-cline-research archive --format=tar.gz --output="$GITHUB_WORKSPACE/evidence/named-fork.tar.gz" HEAD
          git -C /tmp/sub2api-cline-research grep -n -i -E 'api\.cline\.bot|clinepass|cline_free|platformcline' -- backend frontend > evidence/named-fork-matches.txt || code=$?
          test "${code:-0}" -le 1
          cat evidence/named-fork-head.txt
          cat evidence/named-fork-matches.txt
      - name: Inventory public fork networks and repository search
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib,time,urllib.parse,urllib.request
          out=pathlib.Path('evidence'); errors=[]; repos={}; inventories={}; searches={}
          def get(path):
              req=urllib.request.Request('https://api.github.com/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sub2api-cline-rebuild-research'})
              with urllib.request.urlopen(req,timeout=40) as r: return json.load(r)
          for parent,maximum in [('ranxi2001/sub2api',10),('Wei-Shaw/sub2api',5)]:
              pages=[]
              for page in range(1,maximum+1):
                  try: rows=get(f'repos/{parent}/forks?sort=newest&per_page=100&page={page}')
                  except Exception as e: errors.append({'target':parent,'page':page,'error':str(e)});break
                  if not isinstance(rows,list): errors.append({'target':parent,'unexpected_response':True});break
                  pages.extend(rows)
                  for r in rows: repos[r['full_name']]=r
                  if len(rows)<100: break
              inventories[parent]=[{k:r.get(k) for k in ['full_name','default_branch','created_at','pushed_at','description','forks_count','stargazers_count','archived']} for r in pages]
          for q in ['sub2api cline fork:true','sub2api cline in:readme fork:true','sub2api clinepass in:readme fork:true']:
              try:
                  data=get('search/repositories?q='+urllib.parse.quote(q)+'&per_page=100')
                  searches[q]={'total_count':data.get('total_count'),'incomplete_results':data.get('incomplete_results'),'items':[{k:r.get(k) for k in ['full_name','default_branch','pushed_at','description']} for r in data.get('items',[])]}
              except Exception as e: errors.append({'query':q,'error':str(e)})
              time.sleep(2)
          report={'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'inventories':inventories,'repository_search':searches,'errors':errors,'coverage_note':'Fork inventory is newest-first and bounded; metadata alone does not prove Cline implementation. No code from third-party forks is executed.'}
          (out/'fork-inventory.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({'counts':{k:len(v) for k,v in inventories.items()},'search':searches,'errors':errors},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cline-v210-pinned-rebuild-evidence
          path: evidence/
          retention-days: 7
