name: Cline exact-source development snapshot

on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-development-snapshot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-dependencies:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install locked public frontend dependencies
        working-directory: frontend
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          pnpm install --frozen-lockfile
          git diff --exit-code
          tar -czf "$RUNNER_TEMP/frontend-dependencies.tar.gz" node_modules
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/source-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: cline-frontend-dependencies-${{ github.sha }}
          path: |
            ${{ runner.temp }}/frontend-dependencies.tar.gz
            ${{ runner.temp }}/source-sha.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
