name: Native account offline review dependencies
on:
  push:
    branches: [codex/cline-native-account-flow-20261007]
    paths: [.github/workflows/native-account-review-tools.yml]
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-account-offline-review-deps
          run-id: 37643697496
          github-token: ${{ github.token }}
          path: deps
      - name: Describe bounded public dependency archives
        run: ls -lh deps
      - uses: actions/upload-artifact@v4
        with:
          name: native-account-frontend-deps
          path: deps/frontend-node-modules.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: native-account-go-deps
          path: deps/go-modules.tar.gz
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: native-account-go-toolchain
          path: |
            deps/go-toolchain.tar.gz
            deps/checksums.txt
            deps/source-tree.txt
            deps/source-identity.txt
          compression-level: 0
          retention-days: 1
