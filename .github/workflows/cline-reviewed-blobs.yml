name: Cline reviewed-blob development transport

on:
  push:
    branches: ['codex/cline-platform-modular-20261001']
    paths: ['.github/workflows/cline-reviewed-blobs.yml']

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/cline-platform-modular-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare hash-verified immutable blobs without executing candidate source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .wanchuan/dev-blob-parts/prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: cline-reviewed-blobs-${{ github.sha }}
          path: ${{ runner.temp }}/cline-reviewed-blobs.json
          retention-days: 1
          if-no-files-found: error
