name: Wanchuan promote

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Wanchuan revision number, or auto
        required: false
        default: auto
        type: string
  push:
    branches:
      - wanchuan/promote

concurrency:
  group: wanchuan-promote
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  checks: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v6
        with:
          ref: wanchuan/stable
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve and verify release identity
        id: release
        env:
          REQUESTED_REVISION: ${{ inputs.revision || 'auto' }}
        run: |
          set -euo pipefail
          python3 tools/wanchuan_patchpack.py verify

          upstream_tag="$(jq -r '.tag' .wanchuan/upstream.lock)"
          upstream_version="${upstream_tag#v}"
          source_version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [[ "${source_version}" != "${upstream_version}" ]]; then
            echo "Source VERSION ${source_version} is not upstream-clean (${upstream_version})" >&2
            exit 1
          fi

          git fetch origin --tags --force
          requested="${REQUESTED_REVISION}"
          if [[ "${requested}" == "auto" || -z "${requested}" ]]; then
            highest=0
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] && continue
              revision="${tag##*.}"
              if [[ "${revision}" =~ ^[1-9][0-9]*$ ]] && (( revision > highest )); then
                highest="${revision}"
              fi
            done < <(git tag -l "v${upstream_version}-wanchuan.*")

            if (( highest == 0 )); then
              revision=1
            else
              latest_tag="v${upstream_version}-wanchuan.${highest}"
              if gh release view "${latest_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                revision=$((highest + 1))
              else
                revision="${highest}"
              fi
            fi
          else
            if [[ ! "${requested}" =~ ^[1-9][0-9]*$ ]]; then
              echo "revision must be a positive integer or auto" >&2
              exit 1
            fi
            revision="${requested}"
          fi

          version="$(python3 tools/wanchuan_patchpack.py next-version             --upstream-tag "${upstream_tag}"             --revision "${revision}")"
          stable_sha="$(git rev-parse HEAD)"
          stable_tree="$(git rev-parse 'HEAD^{tree}')"
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "stable_sha=${stable_sha}"
            echo "stable_tree=${stable_tree}"
            echo "upstream_tag=${upstream_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Require latest stable checks to be green
        env:
          STABLE_SHA: ${{ steps.release.outputs.stable_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${STABLE_SHA}/check-runs?per_page=100" > "$RUNNER_TEMP/stable-checks.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = {
              "shell",
              "test",
              "frontend",
              "golangci-lint",
              "release-helpers",
              "backend-security",
              "frontend-security",
              "patch-inventory",
              "cline-cas",
              "legacy-patch-regression",
              "frontend-upgrade-regression",
          }
          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "stable-checks.json").read_text())
          latest = {}
          for check in payload.get("check_runs", []):
              name = check.get("name")
              if name not in required:
                  continue
              stamp = check.get("completed_at") or check.get("started_at") or ""
              previous = latest.get(name)
              previous_stamp = ""
              if previous is not None:
                  previous_stamp = previous.get("completed_at") or previous.get("started_at") or ""
              if previous is None or stamp > previous_stamp:
                  latest[name] = check
          missing = sorted(required - set(latest))
          bad = {name: check.get("conclusion") for name, check in latest.items() if check.get("conclusion") != "success"}
          if missing or bad:
              raise SystemExit(f"stable gates are not green: missing={missing} bad={bad}")
          print("stable gates green:", ", ".join(sorted(required)))
          PY

      - name: Require successful candidate for exact stable tree
        env:
          STABLE_TREE: ${{ steps.release.outputs.stable_tree }}
        run: |
          set -euo pipefail
          git fetch origin wanchuan/release-candidate
          candidate_sha="$(git rev-parse origin/wanchuan/release-candidate)"
          candidate_tree="$(git rev-parse "origin/wanchuan/release-candidate^{tree}")"
          if [[ "${candidate_tree}" != "${STABLE_TREE}" ]]; then
            echo "Candidate tree ${candidate_tree} does not match stable tree ${STABLE_TREE}" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${candidate_sha}&per_page=100" > "$RUNNER_TEMP/candidate-runs.json"
          CANDIDATE_SHA="${candidate_sha}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "candidate-runs.json").read_text())
          matches = [
              run for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == os.environ["CANDIDATE_SHA"]
              and run.get("name") == "Wanchuan release candidate"
          ]
          if not matches:
              raise SystemExit("no release-candidate workflow run found for candidate head")
          latest = max(matches, key=lambda run: run.get("created_at") or "")
          if latest.get("conclusion") != "success":
              raise SystemExit(
                  f"latest release candidate is not successful: "
                  f"status={latest.get('status')} conclusion={latest.get('conclusion')}"
              )
          print("candidate gate green:", latest.get("html_url"))
          PY

      - name: Create or recover immutable release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          STABLE_SHA: ${{ steps.release.outputs.stable_sha }}
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force

          if git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tagged_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [[ "${tagged_sha}" != "${STABLE_SHA}" ]]; then
              echo "Immutable tag ${RELEASE_TAG} points to ${tagged_sha}, expected ${STABLE_SHA}" >&2
              exit 1
            fi
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${RELEASE_TAG} already exists at the validated stable commit."
              exit 0
            fi

            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=100" > "$RUNNER_TEMP/release-runs.json"
            if ACTIVE_TAG="${RELEASE_TAG}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release-runs.json").read_text())
          active = [
              run for run in payload.get("workflow_runs", [])
              if run.get("head_branch") == os.environ["ACTIVE_TAG"]
              and run.get("status") != "completed"
          ]
          if active:
              print("release workflow already active:", active[0].get("html_url"))
              raise SystemExit(0)
          raise SystemExit(1)
          PY
            then
              exit 0
            fi

            gh workflow run release.yml               --repo "${GITHUB_REPOSITORY}"               --ref "${RELEASE_TAG}"               -f tag="${RELEASE_TAG}"               -f simple_release=false
            echo "Recovered release workflow for existing tag ${RELEASE_TAG}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${STABLE_SHA}"             -m "Wanchuan ${RELEASE_VERSION}"             -m "Upstream: ${UPSTREAM_TAG}"             -m "Validated stable source: ${STABLE_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"
          gh workflow run release.yml             --repo "${GITHUB_REPOSITORY}"             --ref "${RELEASE_TAG}"             -f tag="${RELEASE_TAG}"             -f simple_release=false
          echo "Published ${RELEASE_TAG} and explicitly dispatched release.yml."
