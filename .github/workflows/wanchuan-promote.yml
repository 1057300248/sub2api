name: Wanchuan promote

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Positive Wanchuan revision, or auto
        default: auto
        required: false
        type: string
  push:
    branches: [wanchuan/promote]

concurrency:
  group: wanchuan-promote
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  promote:
    if: github.repository == '1057300248/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: wanchuan/stable
          fetch-depth: 0
      - name: Verify immutable source and all workflow gates
        id: source
        run: |
          set -euo pipefail
          python3 tools/wanchuan_patchpack.py verify
          sha="$(git rev-parse HEAD)"
          python3 tools/wanchuan_ci_gate.py verify --sha "$sha" --output "$RUNNER_TEMP/wanchuan-gates.json"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Choose an immutable revision and dispatch the full release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          REVISION: ${{ inputs.revision || 'auto' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def call(*args):
              return subprocess.run(args, check=True, text=True, capture_output=True, timeout=120).stdout.strip()

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['SOURCE_SHA']
          lock = json.loads(Path('.wanchuan/upstream.lock').read_text())
          base = lock['tag'].removeprefix('v')
          if Path('backend/cmd/server/VERSION').read_text().strip() != base:
              raise SystemExit('Source VERSION must remain upstream-clean')
          call('git', 'fetch', '--no-tags', 'origin', '+refs/tags/*:refs/tags/*')
          tags = call('git', 'tag', '-l', f'v{base}-wanchuan.*').splitlines()
          pattern = re.compile(r'v' + re.escape(base) + r'-wanchuan\.([1-9][0-9]*)')
          known = sorted((int(m[1]), t) for t in tags if (m := pattern.fullmatch(t)))
          requested = os.environ['REVISION']
          if requested == 'auto':
              revision = known[-1][0] + 1 if known else 1
              if known and call('git', 'rev-parse', known[-1][1] + '^{commit}') == sha:
                  revision = known[-1][0]  # A retry is not a new release.
          elif re.fullmatch(r'[1-9][0-9]{0,8}', requested):
              revision = int(requested)
          else:
              raise SystemExit('Invalid revision')
          tag = f'v{base}-wanchuan.{revision}'
          if known and revision < known[-1][0]:
              raise SystemExit('Refusing to republish an older revision as latest')
          if tag in tags:
              if call('git', 'rev-parse', tag + '^{commit}') != sha:
                  raise SystemExit('Existing tag points to another source; it will not be rewritten')
          else:
              if known and revision <= known[-1][0]:
                  raise SystemExit('Refusing to publish an older revision as latest')
              # Recheck branch movement immediately before creating a new tag.
              heads = call('git', 'ls-remote', '--exit-code', 'origin', 'refs/heads/wanchuan/stable')
              if heads.split()[0] != sha:
                  raise SystemExit('Stable moved during promotion')
              call('git', 'config', 'user.name', 'github-actions[bot]')
              call('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              call('git', 'tag', '-a', tag, sha, '-m', f'Wanchuan {tag}; upstream {lock["tag"]}; validated source {sha}')
              call('git', 'push', 'origin', 'refs/tags/' + tag)
          from sys import path
          path.insert(0, 'tools')
          from wanchuan_ci_gate import records
          existing = subprocess.run(['gh', 'api', f'repos/{repo}/releases/tags/{tag}'], text=True, capture_output=True, timeout=120)
          if existing.returncode == 0:
              data = json.loads(existing.stdout)
              if not data.get('draft') and not data.get('prerelease'):
                  names = {a.get('name') for a in data.get('assets', [])}
                  expected = {'checksums.txt', 'wanchuan-release.json', f'sub2api_{tag[1:]}_linux_amd64.tar.gz'}
                  if not expected.issubset(names):
                      raise SystemExit('Published release is incomplete; inspect assets before recovery')
                  print(f'Release {tag} already published; no duplicate dispatch')
                  raise SystemExit(0)
              raise SystemExit('Draft or prerelease exists; inspect it before retrying')
          if 'HTTP 404' not in existing.stderr:
              raise SystemExit('Could not verify release absence: ' + existing.stderr)
          runs = records(f'repos/{repo}/actions/workflows/release.yml/runs?per_page=100', 'workflow_runs')
          if any(r.get('head_branch') == tag and r.get('head_sha') == sha and r.get('status') != 'completed' for r in runs):
              print('Release build already active; no duplicate dispatch')
          else:
              call('gh', 'workflow', 'run', 'release.yml', '--repo', repo, '--ref', tag, '-f', f'tag={tag}', '-f', 'simple_release=false', '-f', 'notify_release=false', '-f', 'dry_run=false')
              print(f'Dispatched full release for {tag} at {sha}')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wanchuan-promotion-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/wanchuan-gates.json
          if-no-files-found: warn
