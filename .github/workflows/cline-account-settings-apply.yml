name: Prepare reviewed Cline account settings sources
on:
  push:
    branches: [codex/sub2-v2910-cline-only-20261006]
permissions:
  contents: read
jobs:
  prepare-source-objects:
    if: github.repository == '1057300248/sub2api' && github.ref == 'refs/heads/codex/sub2-v2910-cline-only-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply hash-pinned source patch and remove temporary delivery files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '89241a2b823810791a879e793405d235fe68b490'
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          parts = [Path('.cline-account-settings-apply') / ('%02d.b64' % i) for i in range(4)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True), memlimit=128*1024*1024)
          assert len(patch) == 138408
          assert hashlib.sha256(patch).hexdigest() == 'ec9ade8a916d98bec91fadf90e20e993653f6eab056d06e57430e96a25a1dc0c'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm -r -- .cline-account-settings-apply .github/workflows/cline-account-settings-apply.yml
          python3 tools/verify_cline_only.py
          python3 tools/verify_cline_platform.py
          git diff --cached --check
          test "$(git write-tree)" = '75cc1a49fc9f3223f09eec8272152e370b1a5fe2'
          git diff --cached --stat
      - name: Store verified source objects only; no branch movement or publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          def post(endpoint, data):
              request = urllib.request.Request('https://api.github.com/repos/1057300248/sub2api/git/'+endpoint, data=json.dumps(data).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          assert git('rev-parse','HEAD') == os.environ['GITHUB_SHA']
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z','89241a2b823810791a879e793405d235fe68b490']).decode().split('\0')
          entries = []
          for name in filter(None, paths):
              path = Path(name)
              assert path.is_file() and not name.startswith('.cline-account-settings-apply/')
              data = path.read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              blob = post('blobs', {'encoding':'base64','content':base64.b64encode(data).decode()})
              assert blob['sha'] == expected
              mode = git('ls-files','--stage','--',name).split()[0]
              entries.append({'path':name,'mode':mode,'type':'blob','sha':expected})
          tree = post('trees', {'base_tree':'e6766a7b203ff22462b91fc4872a49da52f0311e','tree':entries})
          assert tree['sha'] == git('write-tree') == '75cc1a49fc9f3223f09eec8272152e370b1a5fe2'
          report = {'parent':git('rev-parse','HEAD'),'base_commit':'89241a2b823810791a879e793405d235fe68b490','source_tree':tree['sha'],'patch_sha256':'ec9ade8a916d98bec91fadf90e20e993653f6eab056d06e57430e96a25a1dc0c','tree_elements':entries}
          Path(os.environ['RUNNER_TEMP'],'cline-account-settings-objects.json').write_text(json.dumps(report,indent=2)+'\n')
          print('SOURCE_OBJECTS_STORED',len(entries),'VERIFIED_TREE',tree['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cline-account-settings-objects-${{ github.sha }}
          path: ${{ runner.temp }}/cline-account-settings-objects.json
          retention-days: 3
